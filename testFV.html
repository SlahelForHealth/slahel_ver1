<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>testFV</title>
<style>
body { font-family: "Hiragino Sans", Arial, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; max-width: 390px; margin: 16px auto; padding: 0 16px; line-height: 1.7; font-size: 17px; color: #222; }
p, div { margin: 0.3em 0; }
h1, h2, h3 { line-height: 1.4; }
img, video { max-width: 100%; }
.video-wrapper { display: block; margin: 12px auto; width: 100%; height: auto; max-width: 100%; }
.video-wrapper video, .video-wrapper img { width: 100%; height: auto; display: block; }
.video-wrapper video { background: transparent; }
.video-wrapper a { display: block; text-decoration: none; }
.video-wrapper.align-left { float: left; margin: 6px 16px 6px 0; max-width: 50%; }
.video-wrapper.align-right { float: right; margin: 6px 0 6px 16px; max-width: 50%; }
.video-wrapper.align-center { display: block; margin: 12px auto; float: none; }
.video-wrapper.fullbleed { width: calc(100% + 32px); max-width: none; margin-left: -16px; margin-right: -16px; }
.quiz-set { --quiz-border:#222; --quiz-fill:#222; --quiz-text-on-fill:#fff; display:flex; flex-direction:column; gap:10px; margin:16px 0; }
.quiz-option { display:flex; align-items:center; gap:12px; padding:14px 24px; border:2px solid var(--quiz-border); border-radius:999px; font-weight:bold; font-size:18px; color:var(--quiz-text, var(--quiz-border)); background:#fff; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.16); transition:transform .08s, box-shadow .08s, background .12s; user-select:none; -webkit-tap-highlight-color:transparent; }
.quiz-option.selected, .quiz-option:active { background:color-mix(in srgb, var(--quiz-fill) 9%, #fff);color:var(--quiz-text, var(--quiz-border));transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.16); }
.quiz-radio { width:18px; height:18px; border:2px solid currentColor; border-radius:50%; flex:0 0 auto; position:relative; }
.quiz-option.selected .quiz-radio::after { content:''; position:absolute; top:3px; left:3px; width:8px; height:8px; border-radius:50%; background:currentColor; }
.quiz-text { flex:1; min-width:0; }
.ed-box { position: relative; }
.ed-box.with-quote::before { content: '\201C'; position: absolute; top: -8px; left: 10px; font-size: 56px; font-family: Georgia, "Times New Roman", "Yu Mincho", serif; color: rgba(0,0,0,0.22); line-height: 1; pointer-events: none; }
.ed-box.with-quote::after { content: '\201D'; position: absolute; bottom: -28px; right: 10px; font-size: 56px; font-family: Georgia, "Times New Roman", "Yu Mincho", serif; color: rgba(0,0,0,0.22); line-height: 1; pointer-events: none; }
@media (max-width: 420px) {
  .video-wrapper.align-left, .video-wrapper.align-right { float: none !important; max-width: 100% !important; margin: 12px auto !important; }
}
</style>
</head>
<body>
<div id="article-body">
<div class="video-wrapper selected fullbleed" data-filename="testFV.png" data-media-kind="image"><img src="images/testFV.png" alt="testFV.png"></div><p><br></p>
</div>
<script>
/* 自動リロード: 1.5秒毎にこのファイルのLast-Modifiedをチェックし、変わっていたらリロード */
(function () {
  let last = null;
  let active = !document.hidden;
  document.addEventListener('visibilitychange', () => { active = !document.hidden; });
  setInterval(async () => {
    if (!active) return;
    try {
      const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
      const m = r.headers.get('Last-Modified');
      if (last && m && m !== last) { location.reload(); return; }
      if (m) last = m;
    } catch (e) {}
  }, 1500);
})();
/* クイズ: 選択ボタンのクリックでセット内の選択状態を切替 */
document.addEventListener('click', function (e) {
  var opt = e.target.closest && e.target.closest('.quiz-option');
  if (!opt) return;
  var set = opt.closest('.quiz-set');
  if (!set) return;
  var was = opt.classList.contains('selected');   // もう一度押したら解除
  var opts = set.querySelectorAll('.quiz-option');
  for (var i = 0; i < opts.length; i++) opts[i].classList.remove('selected');
  if (!was) opt.classList.add('selected');
});
</script>
</body>
</html>
